name: Contrôles

on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler la base
        run: python3 outils/valider.py
      - name: Construire la base
        run: python3 outils/construire.py
      - name: Refaire les vérifications à partir des copies archivées
        run: |
          python3 verifications/lustig-2026-10-18/verifier.py
          git diff --exit-code -- verifications
