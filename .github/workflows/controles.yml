name: Contrôles

on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler la base
        run: python3 outils/valider.py
      - name: Vérifier que le rapport de cohérence est à jour
        run: |
          python3 outils/controler_coherence.py
          git diff --exit-code -- controles
      - name: Construire la base
        run: python3 outils/construire.py
